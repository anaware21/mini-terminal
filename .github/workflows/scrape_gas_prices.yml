name: Scrape Gas Prices

on:
  schedule:
    - cron: '0 17 * * *'  # daily at noon EST (UTC-5)
  workflow_dispatch:       # allows manual trigger
    inputs:
      target:
        description: 'Which tables to write to'
        type: choice
        options:
          - test
          - prod
        default: test

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r data/gas/requirements.txt

      - name: Run scraper and upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Manual runs write to the test_ tables unless you pick "prod".
          # The cron is not a workflow_dispatch, so it always gets '' (= prod).
          TABLE_PREFIX: ${{ (github.event_name == 'workflow_dispatch' && inputs.target != 'prod') && 'test_' || '' }}
        run: python data/gas/upload.py
